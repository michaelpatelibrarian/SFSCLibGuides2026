<!--
  LibGuides Look & Feel — CSS block contents (source of truth).
  These lines load the site fonts and the custom stylesheet on every public page.
  Order matters: preconnects first, then fonts, then sfsccustom.css.
  Removing "family=Lexend" silently breaks the .readability utility (guide content uses it).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto Sans Display trimmed to the variants the site uses: 400 body, 500 Medium headings/buttons,
     600 Semi Bold, 700 Bold — plus true italics at 400/700 for guide-content emphasis.
     Weights outside this set will render faux-bold/synthesized; add them here if ever needed. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="https://d2jv02qf7xgjwx.cloudfront.net/sites/7089/include/sfsccustom.css">
