<form id="scholarSearchForm" method="get" target="_blank"
  action="https://scholar.google.com/scholar"
  aria-label="Google Scholar search">

  <label for="scholarQuery" class="visually-hidden">Search Google Scholar</label>
  <div class="input-group sfsc-primo-search">
    <input type="search" id="scholarQuery" name="q" class="form-control sfsc-search-input"
      placeholder="Search Google Scholar"
      aria-label="Search Google Scholar">
    <button type="submit" class="btn btn-sfsc-search">Search</button>
  </div>
</form>

<p class="mt-2">We suggest using the <a href="https://libguides.southflorida.edu/az.php">recommended databases</a> first, but Google Scholar can offer additional sources.</p>
