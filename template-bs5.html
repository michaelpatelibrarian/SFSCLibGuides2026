<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFSC LibGuides - Bootstrap 5 Template</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom SFSC Styles -->
    <link rel="stylesheet" href="sfsccustom.css">
</head>
<body>

    <!-- Include Header -->
    <div w3-include-html="header.html"></div>

    <!-- Main Content Area -->
    <main id="s-lg-guide-main" class="container my-5">
        <div class="row">
            <div class="col-lg-8">
                <h1 class="mb-4">Welcome to SFSC LibGuides</h1>
                <p class="lead">Your gateway to research resources and academic success.</p>

                <!-- Example Card -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h2 class="mb-0 h5">Getting Started</h2>
                    </div>
                    <div class="card-body">
                        <p>Find databases, research guides, and get help from our librarians.</p>
                        <a href="#" class="btn btn-primary">Explore Resources</a>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <!-- Sidebar content would go here -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0 h5">Quick Links</h2>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled">
                            <li class="mb-2"><a href="#">A-Z Databases</a></li>
                            <li class="mb-2"><a href="#">Research Guides</a></li>
                            <li class="mb-2"><a href="#">Ask a Librarian</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Include Footer -->
    <div w3-include-html="footer.html"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom SFSC JS -->
    <script src="sfsccustom.js"></script>

    <!-- Simple HTML Include Script (for demo purposes) -->
    <script>
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            if (this.status == 200) {
                                elmnt.innerHTML = this.responseText;
                                // Trigger custom event when header is loaded
                                if (file === "header.html") {
                                    console.log('Header loaded, triggering dropdown init');
                                    document.dispatchEvent(new CustomEvent('headerLoaded'));
                                }
                            }
                            if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
                            elmnt.removeAttribute("w3-include-html");
                            includeHTML();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    return;
                }
            }
        }
        includeHTML();
    </script>

</body>
</html>
